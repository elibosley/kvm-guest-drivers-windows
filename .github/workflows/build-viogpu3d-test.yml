name: Build viogpu3d test artifact

on:
  workflow_dispatch:
  push:
    branches:
      - fix/viogpu3d-d3-resume-flip-thread

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Show Windows driver toolchain
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products '*' -format json
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\build" |
            Select-Object -ExpandProperty Name

      - name: Build Win11 x64 viogpu
        id: build
        continue-on-error: true
        shell: cmd
        run: >-
          msbuild viogpu\viogpu.sln
          /m
          /t:Build
          /p:Configuration="Win11 Release"
          /p:Platform=x64
          /v:minimal

      # The hosted WDK currently fails the package-validation phase because this
      # repository expects external Neptune UMD files and an InfVerif DLL that
      # is not present in the runner.  Compilation and linking finish first, so
      # require the kernel binary rather than treating that packaging failure as
      # a compiler failure.
      - name: Verify viogpu3d kernel binary
        shell: pwsh
        run: |
          $driver = "viogpu\viogpu3d\objfre_win11_amd64\amd64\viogpu3d.sys"
          if (!(Test-Path $driver)) {
            throw "viogpu3d.sys was not produced (MSBuild outcome: ${{ steps.build.outcome }})"
          }
          Get-Item $driver | Format-List FullName, Length, LastWriteTime

      - name: Upload viogpu3d package
        uses: actions/upload-artifact@v4
        with:
          name: viogpu3d-win11-x64
          if-no-files-found: error
          path: |
            viogpu/viogpu3d/objfre_win11_amd64/amd64/**
